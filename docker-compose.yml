# Deploys next to the khodroban stack on srv4865646489. No domain yet — exposed
# directly on a host port; swap to the khodroban Caddy network + a Caddyfile block
# once a domain is ready (see git history for that version).
name: growth-hub-next
services:
  hub-next:
    build: .
    restart: unless-stopped
    environment:
      HUB_HOSTS: ${HUB_DOMAIN:-localhost}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
      GOOGLE_PROXY_URL: ${GOOGLE_PROXY_URL:-}
    volumes:
      - hub-next-data:/data
    ports: ["${HUB_HOST_PORT:-4500}:4500"]
    mem_limit: 1g
volumes:
  hub-next-data:
